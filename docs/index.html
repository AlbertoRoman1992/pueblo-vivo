<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pueblo Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>

<style>
  :root { --ink: #2b1d14; --paper: #f6ead2; --paper-2: #efdcb8; --paper-3: #e2c99a; --gold: #e8b54a; --red: #b8452c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: 'Pixelify Sans', ui-monospace, monospace; color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: absolute; inset: 0; }

  #clock .big { font-weight: 700; font-size: 1.25em; display: flex; gap: .35em; align-items: baseline; }
  #clock .small { font-size: .72em; opacity: .85; }
  #town { right: 1.4vmin; top: 1.6vmin; width: clamp(190px, 34vmin, 360px); font-size: clamp(12px, 2.8vmin, 27px); cursor: pointer; }
  #town .tname { font-size: .7em; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  #town .tname > span:first-child { opacity: .75; }
  #town .tlevel { font-weight: 700; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #town .tlevel.long { font-size: .9em; }
  .stars { color: var(--gold); text-shadow: 0 1px 0 #7a5a1a; font-size: .8em; letter-spacing: .05em; white-space: nowrap; }
  .bar { height: .55em; background: #d8c3a0; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; margin: .25em 0 .2em; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(#f3c85e, #d9962f); transition: width .8s; }
  #town .tstats { font-size: .78em; display: flex; justify-content: space-between; }
  #town .tnext { font-size: .66em; opacity: .8; margin-top: .15em; }
  #town.pulse { animation: pulse 1.2s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(232,181,74,.6), 0 4px 0 rgba(0,0,0,.35); } }
  #ticker { left: 1.4vmin; bottom: 1.6vmin; max-width: 46vw; font-size: clamp(12px, 2.8vmin, 28px); display: flex; gap: .5em; align-items: center; transition: opacity .6s; overflow: hidden; }
  #ticker .lbl { background: var(--red); color: #fff4dc; border-radius: 6px; padding: 0 .35em; font-size: .7em; font-weight: 600; flex: none; }
  #tk-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
  #tk-text.in { animation: slidein .45s ease-out; }
  @keyframes slidein { from { transform: translateY(80%); opacity: 0; } to { transform: none; opacity: 1; } }

    font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.35);

  #card .row { font-size: .9em; }
  #card .note { font-size: .8em; margin-top: .1em; }

  #banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; text-align: center;
    background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 8px 0 rgba(0,0,0,.4), 0 0 0 9999px rgba(20,12,6,.25);
    padding: 1em 1.6em; font-size: clamp(14px, 3.6vmin, 36px); transition: opacity .5s, transform .5s cubic-bezier(.2,1.6,.4,1); max-width: 86vw; }
  #banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner .b-sub { font-size: .7em; opacity: .8; }
  #banner .b-title { font-size: 1.6em; font-weight: 700; margin: .1em 0; }

  #book .inner { position: relative; width: min(92vw, 1100px); height: 86vh; background: var(--paper); border: 4px solid var(--ink); border-radius: 14px;
    box-shadow: 0 8px 0 rgba(0,0,0,.45), inset 0 0 0 6px var(--paper-2); display: flex; flex-direction: column; overflow: hidden; }
  #book header { display: flex; align-items: center; gap: .4em; padding: .55em .8em .45em; border-bottom: 3px solid var(--ink); background: var(--paper-2); flex-wrap: wrap; }

  #book .tab.on { background: var(--gold); }

  #book .body { flex: 1; overflow-y: auto; padding: .8em 1.1em 1.4em; -webkit-overflow-scrolling: touch; }
  #book h3 { font-size: 1em; margin: .8em 0 .35em; border-bottom: 2px dashed var(--paper-3); }
  .lvl-big { font-size: 1.7em; font-weight: 700; }
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5em, 1fr)); gap: .5em; margin-top: .5em; }
  .stat { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; padding: .35em .5em; text-align: center; }
  .stat b { display: block; font-size: 1.35em; }
  .stat span { font-size: .75em; opacity: .85; }
  .proj { display: flex; align-items: center; gap: .6em; padding: .35em 0; border-bottom: 1px dashed var(--paper-3); }

  .chip.hecho { background: #b8d98f; } .chip.obras { background: #f3c85e; } .chip.pendiente { background: #efdcb8; } .chip.bloqueado { background: #d6ccbc; opacity: .8; }
  .tl { list-style: none; }
  .tl li { display: flex; gap: .6em; padding: .4em 0; border-bottom: 1px dashed var(--paper-3); align-items: baseline; }
  .tl .d { font-size: .72em; opacity: .75; width: 5.4em; flex: none; }
  .tl .i { width: 1.4em; text-align: center; flex: none; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2em, 1fr)); gap: .55em; }
  .person { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; padding: .35em; text-align: center; cursor: pointer; }
  .person canvas { width: 2.6em; height: 3.9em; image-rendering: pixelated; display: block; margin: 0 auto .15em; }
  .person b { display: block; font-size: .9em; }
  .person span { font-size: .7em; opacity: .85; }
  .empty { opacity: .7; font-size: .9em; }
  #wrap { touch-action: none; cursor: grab; }
  #wrap.drag { cursor: grabbing; }
  #zoom { position: absolute; right: 1.4vmin; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1vmin; }
  #zoom button { font: inherit; font-weight: 700; font-size: clamp(16px, 3.6vmin, 34px); width: clamp(36px, 7.5vmin, 70px); height: clamp(36px, 7.5vmin, 70px);
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer; line-height: 1; }
  #zoom button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
</style>

<body>
<div id="wrap">
  <canvas id="world" class="layer"></canvas>
  <canvas id="ui" class="layer"></canvas>
  <div id="clock" class="pill"><div class="big"><span id="c-time">07:30</span><span id="c-wx">☀️</span></div><div class="small"><span id="c-day">Día 1 · lunes</span> · <span id="c-season">Otoño</span></div></div>
  <div id="town" class="pill" title="Libro del pueblo">
    <div class="tname"><span>Pueblo Vivo 📖</span><span class="stars" id="t-stars">★☆☆☆☆</span></div>
    <div class="tlevel" id="t-level">Aldea</div>
    <div class="bar"><i id="t-bar"></i></div>
    <div class="tstats"><span>👥 <b id="t-pop">21</b></span><span>😊 <b id="t-happy">70</b>%</span><span>🌾 <b id="t-harv">55</b>%</span></div>
    <div class="tnext" id="t-next"></div>
  </div>
  <div id="zoom"><button id="z-in" title="Acercar">＋</button><button id="z-out" title="Alejar">－</button><button id="z-home" title="Volver a la plaza">⌂</button></div>
  <div id="hint" class="pill">Di: «Alexa, que llueva» · Toca a un vecino</div>
  <div id="ticker" class="pill"><span class="lbl">NOTICIAS</span><span id="tk-text">Bienvenido a Pueblo Vivo</span></div>
  <div id="dock">
    <button data-p="lluvia"><span class="ic">🌧️</span>Lluvia<span class="cd"></span></button>
    <button data-p="sol"><span class="ic">☀️</span>Sol<span class="cd"></span></button>
    <button data-p="fiesta"><span class="ic">🎉</span>Fiesta<span class="cd"></span></button>
    <button data-p="forastero"><span class="ic">🧳</span>Forastero<span class="cd"></span></button>
    <button data-p="bendecir"><span class="ic">✨</span>Bendecir<span class="cd"></span></button>
    <button data-p="loteria"><span class="ic">🎟️</span>Lotería<span class="cd"></span></button>
    <button id="btn-book" class="alt"><span class="ic">📖</span>Libro</button>
    <button id="speed" class="alt"><span class="ic">⏩</span><span id="speed-l">x1</span></button>
  </div>
  <div id="card" class="pill"></div>
  <div id="toast" class="pill"></div>
  <div id="banner"><div class="b-sub" id="b-sub"></div><div class="b-title" id="b-title"></div><div class="b-stars" id="b-stars"></div><div class="b-list" id="b-list"></div></div>
  <div id="book">
    <div class="inner">
      <header>
        <h1>📖 Libro del pueblo</h1>
        <button class="tab" data-tab="pueblo">Pueblo</button>
        <button class="tab" data-tab="hitos">Hitos</button>
        <button class="tab" data-tab="cronica">Crónica</button>
        <button class="tab" data-tab="vecinos">Familias</button>
        <button class="close" id="book-close">✕</button>
      </header>
      <div class="body" id="book-body"></div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const P = window.PuebloSim, MW = P.W, MH = P.H, T = P.T, K = P.TILES;
  const M = 96;                       // margen pintado alrededor del mapa (píxeles del mundo)
  const params = new URLSearchParams(location.search);
  const BASE_RATE = 1.2;              // minutos de juego por segundo real (1 día = 20 min)
  const OFFLINE_RATE = 24 / 60;       // minutos de juego por segundo real sin mirar (1 día por hora)
  const OFFLINE_CAP = 3 * P.DAY;      // máximo 3 días de avance al volver
  const SPEEDS = [1, 5, 20];
  const COOLDOWN = { forastero: 180, loteria: 1440 };
  let speedIdx = Math.max(0, SPEEDS.indexOf(Number(params.get('speed')) || 1));
  let S = null, alexa = null, lastSave = 0, selected = null, selectedB = null, bgKey = '';
  const cool = {};
  const $ = function (id) { return document.getElementById(id); };
  const clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // ---------- Estación (calendario real) ----------
  const SEASON = (function () {
    const forced = params.get('estacion');
    if (forced) return forced.replace('otoño', 'otono');
    const m = new Date().getMonth() + 1;
    return m === 12 || m <= 2 ? 'invierno' : m <= 5 ? 'primavera' : m <= 8 ? 'verano' : 'otono';
  })();
  const SEASON_NAME = { invierno: 'Invierno', primavera: 'Primavera', verano: 'Verano', otono: 'Otoño' }[SEASON] || 'Otoño';
  const XMAS = (function () { const d = new Date(), m = d.getMonth() + 1, day = d.getDate(); return params.get('navidad') === '1' || (m === 12 && day >= 8) || (m === 1 && day <= 6); })();
  const PALS = {
    primavera: { grass: '#82a548', g1: '#76983f', g2: '#93b656', flowers: ['#f2f2f2', '#f6d34a', '#e98ab0', '#b98ae0'], trees: [['#4f7a36', '#64924a', '#7aa95a'], ['#5b8a3e', '#73a352', '#8cbc66']], blossom: true },
    verano: { grass: '#9da64c', g1: '#909841', g2: '#aeb45c', flowers: ['#f6d34a'], trees: [['#55733a', '#6a8a45', '#7d9d55'], ['#4e6b3a', '#5f7f44', '#728f50']] },
    otono: { grass: '#8c9a4a', g1: '#7f8c40', g2: '#9aa857', flowers: [], trees: [['#a0522d', '#c46a2c', '#d98b3a'], ['#55733a', '#6a8a45', '#7d9d55'], ['#b8862b', '#d0a03a', '#e3b850']] },
    invierno: { grass: '#7d8c5e', g1: '#728152', g2: '#8a9a6c', flowers: [], trees: [['#3e5a3a', '#4c6b45', '#5a7a52']], bare: true }
  };
  const PAL = PALS[SEASON] || PALS.otono;
  document.body.style.background = PAL.grass;

  // ---------- Lienzos y cámara ----------
  const world = $('world'), ui = $('ui'), wrap = $('wrap');
  const g = world.getContext('2d'), u = ui.getContext('2d');
  const bg = document.createElement('canvas'); bg.width = MW + 2 * M; bg.height = MH + 2 * M;
  const tmp = document.createElement('canvas'); tmp.width = 120; tmp.height = 120;
  const cam = { x: (P.PLAZA.c + P.PLAZA.w / 2) * T, y: (P.PLAZA.r + P.PLAZA.h / 2) * T, z: Number(params.get('zoom')) || 1, tx: null, ty: null };
  if (params.get('cam')) { const p = params.get('cam').split(','); cam.x = Number(p[0]) * T; cam.y = Number(p[1]) * T; }
  let scale = 1, VW = 480, VH = 300, left = 0, top = 0, lastInput = -1e9;
  function baseScale() { return innerHeight / 300; }
  function minZoom() { return Math.min(innerWidth / (MW + 40), innerHeight / (MH + 40)) / baseScale(); }
  function fit() {
    cam.z = clamp(cam.z, minZoom(), 2.2);
    scale = baseScale() * cam.z;
    VW = Math.ceil(innerWidth / scale); VH = Math.ceil(innerHeight / scale);
    if (world.width !== VW || world.height !== VH) { world.width = VW; world.height = VH; }
    const dpr = devicePixelRatio || 1;
    if (ui.width !== Math.round(innerWidth * dpr)) { ui.width = Math.round(innerWidth * dpr); ui.height = Math.round(innerHeight * dpr); }
  }
  function clampCam() {
    const hw = VW / 2, hh = VH / 2;
    cam.x = VW >= MW + 2 * M ? MW / 2 : clamp(cam.x, hw - M, MW + M - hw);
    cam.y = VH >= MH + 2 * M ? MH / 2 : clamp(cam.y, hh - M, MH + M - hh);
  }
  addEventListener('resize', function () { fit(); clampCam(); });
  function focus(x, y, z) { cam.tx = x; cam.ty = y; if (z) cam.tz = z; }
  function inView(x, y, pad) { pad = pad || 24; return x > left - pad && x < left + VW + pad && y > top - pad && y < top + VH + pad * 2; }

  // ---------- Utilidades de dibujo ----------
  function seeded(seed) { let s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  const shadeCache = {};
  function shade(hex, f) {
    const key = hex + f; if (shadeCache[key]) return shadeCache[key];
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
    if (f < 0) { r *= 1 + f; gg *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; gg += (255 - gg) * f; b += (255 - b) * f; }
    return (shadeCache[key] = '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(gg) << 8) + Math.round(b)).toString(16).slice(1));
  }
  const tileAt = P.tileAt;
  const yardOwner = {};
  P.HOMES.forEach(function (b) { (b.yard || []).forEach(function (p) { yardOwner[p[0] + ',' + p[1]] = b; }); });

  // ---------- Fondo (se repinta solo cuando cambia algo) ----------
  let snowy = 0;
  function backgroundKey() {
    const b = P.PROJECTS.map(function (p) { return p.id + Math.floor(P.buildProgress(S, p.id) * 10); }).join('');
    const hp = S.homeObra ? S.homeObra.id + Math.floor(P.homeProgress(S, S.homeObra.id) * 10) : '';
    return JSON.stringify(S.houses) + b + hp + (snowy > .5 ? 'n' : '') + '|' + (S.deceased || []).length;
  }
  const marginTrees = [], poplars = [];
  function paintBackground() {
    const c = bg.getContext('2d'), r = seeded(7), BW = bg.width, BH = bg.height;
    rect(c, 0, 0, BW, BH, PAL.grass);
    for (let i = 0; i < BW * BH / 46; i++) rect(c, r() * BW, r() * BH, 1, 1, r() < .5 ? PAL.g1 : PAL.g2);
    if (PAL.flowers.length) for (let i = 0; i < BW * BH / 520; i++) rect(c, r() * BW, r() * BH, 1, 1, PAL.flowers[Math.floor(r() * PAL.flowers.length)]);
    if (snowy > .5) { const sr = seeded(17); for (let i = 0; i < BW * BH / 60; i++) rect(c, sr() * BW, sr() * BH, 2 + Math.floor(sr() * 6), 1 + Math.floor(sr() * 2), sr() < .7 ? '#eef2f6' : '#dfe6ee'); }
    c.save(); c.translate(M, M);
    // la carretera y el río siguen fuera del mapa
    const R0 = P.ROAD_PTS[0], R1 = P.ROAD_PTS[P.ROAD_PTS.length - 1];
    drawRoadTile(c, MW, R0[1] * T, M, 2 * T, true); drawRoadTile(c, -M, R1[1] * T, M, 2 * T, true);
    const W0 = P.RIVER_PTS[0], W1 = P.RIVER_PTS[P.RIVER_PTS.length - 1];
    rect(c, -M, (W0[1] - 1) * T, M, 3 * T, '#4f8fb5'); rect(c, MW, (W1[1] - 1) * T, M, 3 * T, '#4f8fb5');
    for (let row = 0; row < P.ROWS; row++) for (let col = 0; col < P.COLS; col++) paintTile(c, col, row, r);
    // detalles de la plaza
    const Q = P.PLAZA;

    left = cam.x - VW / 2; top = cam.y - VH / 2;
    const after = screenToWorld(e.clientX, e.clientY);
    cam.x += before.x - after.x; cam.y += before.y - after.y;
  }, { passive: false });
  function zoomBy(f) { lastInput = performance.now(); cam.tz = clamp(cam.z * f, minZoom(), 2.2); }
  $('z-in').addEventListener('click', function (e) { e.stopPropagation(); zoomBy(1.35); });
  $('z-out').addEventListener('click', function (e) { e.stopPropagation(); zoomBy(1 / 1.35); });
  $('z-home').addEventListener('click', function (e) { e.stopPropagation(); lastInput = performance.now(); cam.tz = 1; focus((P.PLAZA.c + P.PLAZA.w / 2) * T, (P.PLAZA.r + P.PLAZA.h / 2) * T); });
  ['zoom', 'card', 'toast', 'ticker', 'clock', 'hint', 'dock', 'town'].forEach(function (id) { $(id).addEventListener('pointerdown', function (e) { e.stopPropagation(); }); });

  // ---------- Poderes ----------
  function speak(text) {
    // 'chronicle' lo entienden todas las versiones de la skill
    if (alexa) { try { alexa.skill.sendMessage({ type: 'chronicle', text: text }); } catch (e) { console.warn(e); } }
  }
  function usePower(p, fromVoice, opts) {
    if (!fromVoice && (cool[p] || 0) > S.time) { toast('Paciencia… el santo descansa'); return null; }
    const text = P.applyPower(S, p, opts);
    if (!text) return null;
    cool[p] = S.time + (COOLDOWN[p] || 60);
    toast(text, p === 'loteria' ? 6000 : 3800);
    if (p === 'bendecir') { const F = P.FIELD; sparkle((F.c + F.w / 2) * T, (F.r + F.h / 2) * T, 60, ['#fff3a0', '#ffd34d', '#ffffff']); focus((F.c + F.w / 2) * T, (F.r + F.h / 2) * T); }
    if (p === 'fiesta') { fireworksUntil = performance.now() + 4000; focus((P.PLAZA.c + P.PLAZA.w / 2) * T, (P.PLAZA.r + P.PLAZA.h / 2) * T); }
    if (p === 'forastero') focus((P.COLS - 8) * T, P.ROAD_ROWS[0] * T);
    updateHUD(); save(true);
    if (!fromVoice && p === 'loteria') speak(text);
    return text;
  }
  document.querySelectorAll('#dock button[data-p]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); usePower(b.dataset.p, false); }); });
  $('speed-l').textContent = 'x' + SPEEDS[speedIdx];
  $('speed').addEventListener('click', function (e) { e.stopPropagation(); speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed-l').textContent = 'x' + SPEEDS[speedIdx]; });

  // ---------- Guardado ----------
  const DEMO = params.has('demo') || params.has('hora');
  function save(force) {
    const now = Date.now();
    if (DEMO) return;
    if (!force && now - lastSave < 60000) return;
    lastSave = now; S.savedAt = now;
    const json = P.serialize(S);
    try { localStorage.setItem('pueblo-vivo', json); } catch (e) { /* sin almacenamiento local */ }
    if (alexa) { try { alexa.skill.sendMessage({ type: 'save', state: json }); } catch (e) { console.warn(e); } }
  }
  addEventListener('pagehide', function () { save(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(true); });

  // Modo prueba: ?demo=10 crea un pueblo con 10 días vividos; ?hora=21 salta a esa hora. No guarda nada.
  function loadDemo() {
    const st = P.createWorld(Number(params.get('semilla')) || 4242);
    const days = Number(params.get('demo')) || 0;
    if (days > 0) P.fastForward(st, days * P.DAY);
    if (params.has('hora')) P.fastForward(st, ((Number(params.get('hora')) * 60 - st.time % P.DAY) + P.DAY) % P.DAY || 1);
    if (params.get('tiempo') === 'lluvia') P.applyPower(st, 'lluvia');
    return { S: st, text: null, fresh: false, since: st.time };
  }
  function load(startData) {
    if (DEMO) return loadDemo();
    let json = startData && startData.state, st = null;
    if (!json) { try { json = localStorage.getItem('pueblo-vivo'); } catch (e) { json = null; } }
    if (params.get('nuevo') === '1') json = null;
    try { st = json ? P.deserialize(json) : null; } catch (e) { st = null; }
    if (st && startData && startData.state) {
      try { const loc = P.deserialize(localStorage.getItem('pueblo-vivo')); if (loc && (loc.savedAt || 0) > (st.savedAt || 0)) st = loc; } catch (e) { /* nada */ }
    }
    if (!st) return { S: P.createWorld(Date.now() % 100000), text: null, fresh: true, since: 0 };
    const since = st.time;
    const away = st.savedAt ? (Date.now() - st.savedAt) / 1000 : 0;
    const mins = Math.min(OFFLINE_CAP, Math.floor(away * OFFLINE_RATE));
    if (mins >= 30) P.fastForward(st, mins);
    return { S: st, text: mins >= 30 ? P.chronicle(st, since) : null, fresh: false, since: since };
  }

  // ---------- Conexión con Alexa ----------
  function onAlexaMessage(msg) {
    if (!msg || !S) return;
    if (msg.type === 'power') {
      usePower(msg.power, true, { name: msg.name || null });
    } else if (msg.type === 'requestChronicle') {
      speak(P.chronicle(S, Math.max(0, S.time - P.DAY)));
      openBook('cronica', 40000);
    } else if (msg.type === 'ask') {
      const v = P.findVillager(S, msg.name);
      closeBook();
      if (v) { selectVillager(v); speak(P.describeVillager(S, v)); }
      else { const d = P.findDeceased(S, msg.name); speak(d ? P.describeDeceased(S, d) : 'No conozco a nadie que se llame ' + (msg.name ? msg.name.charAt(0).toUpperCase() + msg.name.slice(1) : 'así') + ' en el pueblo.'); }
    }
  }

  function start(startData) {
    const r = load(startData);
    S = r.S;
    S.events.forEach(function (e) { seen.add(e); });
    fit(); clampCam(); updateHUD();
    lastInput = performance.now();   // los primeros segundos, la cámara se queda en la plaza
    if (r.text) { news.push('Mientras no estabas…'); if (alexa) speak(r.text); else toast(r.text, 9000); }
    if (r.fresh) toast('Bienvenido a Pueblo Vivo. Eres su santo patrón.');
    const ups = r.fresh ? [] : S.events.filter(function (e) { return e.levelUp && e.t >= r.since; });
    if (ups.length) setTimeout(function () { celebrateLevel(ups[ups.length - 1].levelUp, true); }, 1500);
    if (DEMO && params.get('libro')) openBook(params.get('libro'));
    if (DEMO && params.get('vecino')) { const v = P.findVillager(S, params.get('vecino')); if (v) selectVillager(v); }
    setTimeout(function () { $('hint').textContent = 'Arrastra para recorrer el pueblo · Toca una casa o un vecino'; }, 12000);
    setTimeout(function () { $('hint').textContent = 'Prueba: «Alexa, ¿cómo está Paco?»'; }, 26000);
    setTimeout(function () { $('hint').style.opacity = 0; }, 42000);
    save(true);
    let prev = performance.now(), hudAcc = 0, acc = 0;
    const frame = 1000 / 30;
    function loop(t) {
      const dt = Math.min(250, t - prev); prev = t; acc += dt;
      if (acc >= frame) {
        P.step(S, (acc / 1000) * BASE_RATE * SPEEDS[speedIdx]);
        render(t, Math.min(acc, 250));
        acc = 0;
        hudAcc += frame;
        if (hudAcc > 500) { hudAcc = 0; updateHUD(); save(false); }
      }
      next(loop);
    }
    // ?prueba=1 usa temporizadores en vez de requestAnimationFrame (para capturas automáticas)
    const next = params.get('prueba') === '1' ? function (f) { setTimeout(function () { f(performance.now()); }, 33); } : requestAnimationFrame.bind(window);
    next(loop);
  }

  // En un Echo Show existe window.Alexa; en un navegador normal se arranca sin él.
  let started = false;
  function startOnce(data) { if (started) return; started = true; start(data); }
  if (window.Alexa && Alexa.create) {
    Alexa.create({ version: '1.1' }).then(function (args) {
      alexa = args.alexa;
      alexa.skill.onMessage(onAlexaMessage);
      $('hint').textContent = 'Di: «Alexa, que llueva» · «Alexa, ¿qué ha pasado?»';
      startOnce(args.message || {});
    }).catch(function (err) { console.warn('Sin Alexa:', err); startOnce({}); });
    setTimeout(function () { startOnce({}); }, 6000);
  } else {
    startOnce({});
  }
})();
</script>
