<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pueblo Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
<script src="sim.js?v=2"></script>
<style>
  :root { --ink: #2b1d14; --paper: #f6ead2; --paper-2: #efdcb8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1b140f; overflow: hidden; }
  body { font-family: 'Pixelify Sans', ui-monospace, monospace; color: var(--ink); user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { position: absolute; left: 0; top: 0; }
  #world { image-rendering: pixelated; image-rendering: crisp-edges; }
  .pill {
    position: absolute; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); padding: .35em .8em; font-size: clamp(14px, 2.2vw, 30px); line-height: 1.15;
  }
  #clock { left: 1.2vw; top: 1.6vh; display: flex; gap: .6em; align-items: baseline; }
  #clock b { font-weight: 600; }
  #ticker { left: 1.2vw; bottom: 2vh; max-width: 44%; transition: opacity .6s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #powers { position: absolute; right: 1.2vw; bottom: 2vh; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6vw; max-width: 54%; }
  #powers button {
    font: inherit; font-size: clamp(12px, 1.6vw, 24px); background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 10px; padding: .25em .6em; box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
  }
  #powers button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  #powers button.cool { opacity: .45; }
  #hint { left: 1.2vw; top: 9.5vh; font-size: clamp(11px, 1.5vw, 20px); background: var(--paper-2); transition: opacity 1s; }
  #card { position: absolute; left: 1.2vw; top: 17vh; width: min(36vw, 440px); display: none; font-size: clamp(13px, 1.8vw, 25px); }
  #card h2 { font-size: 1.3em; font-weight: 600; margin-bottom: .15em; }
  #card .row { opacity: .9; }
  #card .note { font-size: .88em; margin-top: .15em; }
  #card .tag { display: inline-block; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 0 .35em; margin: .25em .2em 0 0; font-size: .85em; }
  #toast {
    position: absolute; right: 1.2vw; top: 1.6vh; font-size: clamp(13px, 2vw, 28px);
    opacity: 0; transition: opacity .5s; pointer-events: none; text-align: right; max-width: 46%;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="world"></canvas>
    <canvas id="ui"></canvas>
    <div id="clock" class="pill"><b id="c-day">Día 1</b><span id="c-time">07:30</span><span id="c-weather">Sol</span></div>
    <div id="powers">
      <button data-p="lluvia">Lluvia</button>
      <button data-p="sol">Sol</button>
      <button data-p="fiesta">Fiesta</button>
      <button data-p="forastero">Forastero</button>
      <button data-p="bendecir">Bendecir</button>
      <button data-p="loteria">Lotería</button>
      <button id="speed">Velocidad x1</button>
    </div>
    <div id="ticker" class="pill">Bienvenido a Pueblo Vivo</div>
    <div id="hint" class="pill">Di: «Alexa, que llueva» · Toca a un vecino</div>
    <div id="card" class="pill"></div>
    <div id="toast" class="pill"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const P = window.PuebloSim, W = P.W, H = P.H, T = P.T, K = P.TILES;
  const params = new URLSearchParams(location.search);
  const BASE_RATE = 1.2;              // minutos de juego por segundo real (1 día = 20 min)
  const OFFLINE_RATE = 24 / 60;       // minutos de juego por segundo real sin mirar (1 día por hora)
  const OFFLINE_CAP = 3 * P.DAY;      // máximo 3 días de avance al volver
  const SPEEDS = [1, 5, 20];
  const COOLDOWN = { forastero: 180, loteria: 1440 };
  let speedIdx = Math.max(0, SPEEDS.indexOf(Number(params.get('speed')) || 1));
  let S = null, alexa = null, lastSave = 0, scale = 1, selected = null, bgKey = '';
  const cool = {};

  // ---------- Lienzos ----------
  const world = document.getElementById('world'), ui = document.getElementById('ui'), wrap = document.getElementById('wrap');
  world.width = W; world.height = H;
  const g = world.getContext('2d'), u = ui.getContext('2d');
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;

  function fit() {
    scale = Math.min(innerWidth / W, innerHeight / H);
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
    [world, ui].forEach(function (c) { c.style.width = cw + 'px'; c.style.height = ch + 'px'; });
    ui.width = cw * (devicePixelRatio || 1); ui.height = ch * (devicePixelRatio || 1);
  }
  addEventListener('resize', fit);

  // ---------- Fondo pixel-art a partir de la rejilla ----------
  function seeded(seed) { let s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  const isWalk = function (t) { return t === K.PATH || t === K.ROAD; };

  function paintBackground() {
    const c = bg.getContext('2d'), r = seeded(7);
    rect(c, 0, 0, W, H, '#8aa04a');
    for (let i = 0; i < 2800; i++) rect(c, r() * W, r() * H, 1, 1, r() < .5 ? '#7d9443' : '#97ad55');
    for (let row = 0; row < P.ROWS; row++) for (let col = 0; col < P.COLS; col++) {
      const t = P.tileAt(col, row), x = col * T, y = row * T;
      if (t === K.PATH || t === K.ROAD) {
        rect(c, x, y, T, T, t === K.ROAD ? '#c9a46a' : '#d0ad75');
        for (let k = 0; k < 5; k++) rect(c, x + r() * T, y + r() * T, 1, 1, r() < .5 ? '#b8935c' : '#dcbd8a');
        // borde suave con la hierba
        if (P.tileAt(col, row - 1) === K.GRASS) rect(c, x, y, T, 1, '#a89060');
        if (P.tileAt(col, row + 1) === K.GRASS) rect(c, x, y + T - 1, T, 1, '#a89060');
        if (P.tileAt(col - 1, row) === K.GRASS) rect(c, x, y, 1, T, '#a89060');
        if (P.tileAt(col + 1, row) === K.GRASS) rect(c, x + T - 1, y, 1, T, '#a89060');
      } else if (t === K.PLAZA || t === K.BENCH || t === K.WATER) {
        rect(c, x, y, T, T, '#d8c7a4');
        for (let yy = 0; yy < T; yy += 4) for (let xx = 0; xx < T; xx += 6) rect(c, x + xx + ((yy / 4) % 2 ? 3 : 0), y + yy, 5, 3, r() < .5 ? '#cfbd98' : '#e2d3b2');
      } else if (t === K.FIELD) {
        rect(c, x, y, T, T, '#7a5532');
        rect(c, x, y + 3, T, 2, '#5e3f22');
      }
    }
    // borde de la plaza
    const Q = P.PLAZA;
    rect(c, Q.c * T - 1, Q.r * T, 1, Q.h * T, '#a89371'); rect(c, (Q.c + Q.w) * T, Q.r * T, 1, Q.h * T, '#a89371');
    rect(c, Q.c * T - 1, (Q.r + Q.h) * T, Q.w * T + 2, 1, '#a89371');
    // valla de la huerta
    const F = P.FIELD;
    for (let x = F.c * T; x < (F.c + F.w) * T; x += 4) { rect(c, x, F.r * T - 2, 1, 3, '#6b4a2b'); rect(c, x, (F.r + F.h) * T, 1, 3, '#6b4a2b'); }
    rect(c, F.c * T, F.r * T - 1, F.w * T, 1, '#8a6a43'); rect(c, F.c * T, (F.r + F.h) * T + 1, F.w * T, 1, '#8a6a43');
    // fuente
    const Fo = P.FOUNTAIN, fx = (Fo.c + 1) * T, fy = (Fo.r + 1) * T;
    c.fillStyle = '#9b8c78'; c.beginPath(); c.arc(fx, fy, 9, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#5aa3c9'; c.beginPath(); c.arc(fx, fy, 6.5, 0, Math.PI * 2); c.fill();
    rect(c, fx - 1, fy - 6, 3, 7, '#b5a68f'); rect(c, fx - 2, fy - 7, 5, 2, '#c9bba3');
    // bancos
    P.BENCHES.forEach(function (p) {
      const x = p[0] * T, y = p[1] * T;
      rect(c, x + 1, y + 2, 14, 3, '#7a4f2a'); rect(c, x + 1, y + 1, 14, 1, '#93613a');
      rect(c, x + 2, y + 5, 2, 2, '#4a2f18'); rect(c, x + 12, y + 5, 2, 2, '#4a2f18');
    });
    // edificios
    P.BUILDINGS.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (b) { house(c, b); });
  }

  function house(c, b) {
    const x = b.x, y = b.y, w = b.pw, h = b.ph, lvl = (S && S.houses[b.id]) || 0;
    rect(c, x + 2, y + h, w - 1, 2, 'rgba(0,0,0,.2)');
    if (b.type === 'iglesia') {
      rect(c, x, y + 30, w, h - 30, '#efe6d2'); rect(c, x, y + 30, w, 2, '#d9cdb3');
      rect(c, x - 1, y + 24, w + 2, 8, '#b3542f'); rect(c, x - 1, y + 24, w + 2, 2, '#cf6a3e');
      const tx = x + w / 2 - 8;
      rect(c, tx, y + 8, 16, 34, '#e8dcc2'); rect(c, tx, y + 8, 16, 2, '#d9cdb3');
      rect(c, tx - 2, y + 4, 20, 6, '#b3542f');
      rect(c, x + w / 2 - 1, y - 5, 2, 10, '#4a3a2a'); rect(c, x + w / 2 - 3, y - 2, 6, 2, '#4a3a2a');
      rect(c, x + w / 2 - 3, y + 13, 6, 6, '#3a2a1a');
      rect(c, x + w / 2 - 6, y + h - 16, 12, 16, '#6b4126'); rect(c, x + w / 2 - 6, y + h - 16, 12, 3, '#80502f');
      rect(c, x + 6, y + 42, 5, 10, '#5a7fa0'); rect(c, x + w - 11, y + 42, 5, 10, '#5a7fa0');
      b.windows = [[x + 6, y + 42, 5, 10], [x + w - 11, y + 42, 5, 10]];
      return;
    }
    const wall = b.type === 'bar' ? '#f2e4c4' : b.type === 'panaderia' ? '#f4e9d0' : lvl >= 2 ? '#fffaf0' : '#f3ecdc';
    const roofs = ['#b85a32', '#d06c3f', '#9c4826'];
    const roof = b.type === 'casa' ? roofs[(b.c + b.r) % 3] : '#a64b2a';
    rect(c, x, y + 11, w, h - 11, wall); rect(c, x, y + h - 3, w, 3, '#d8cbae');
    rect(c, x - 1, y, w + 2, 12, roof);
    for (let i = 0; i < w + 2; i += 4) rect(c, x - 1 + i, y + 2 + ((i / 4) % 2) * 3, 3, 1, 'rgba(0,0,0,.18)');
    rect(c, x - 1, y, w + 2, 2, 'rgba(255,255,255,.18)');
    rect(c, x + w / 2 - 4, y + h - 12, 8, 12, lvl >= 2 ? '#2f5f8a' : '#6b4126');
    rect(c, x + w / 2 + 1, y + h - 7, 1, 1, '#e8c070');
    b.windows = [[x + 5, y + 15, 8, 6], [x + w - 13, y + 15, 8, 6]];
    b.windows.forEach(function (p) {
      rect(c, p[0], p[1], p[2], p[3], '#4d6f8f'); rect(c, p[0] + 3, p[1], 1, p[3], '#d8cbae'); rect(c, p[0], p[1] + p[3], p[2], 1, '#7a4f2a');
      if (lvl >= 1) { rect(c, p[0], p[1] + p[3] + 1, p[2], 2, '#8a4b2a'); rect(c, p[0] + 1, p[1] + p[3], 2, 1, '#e84a6a'); rect(c, p[0] + 5, p[1] + p[3], 2, 1, '#ffd34d'); }
    });
    if (b.type === 'bar' || b.type === 'panaderia') {
      rect(c, x + 2, y + 11, w - 4, 4, b.type === 'bar' ? '#2f6b3a' : '#c48a2e');
      for (let i = 0; i < w - 4; i += 6) rect(c, x + 2 + i, y + 11, 3, 4, '#f6ead2');
      // letrero
      rect(c, x + w / 2 - 9, y + 17, 18, 7, '#5b3b22');
      if (b.type === 'bar') { rect(c, x + w / 2 - 3, y + 18, 5, 5, '#ffd34d'); rect(c, x + w / 2 - 3, y + 18, 5, 1, '#fff'); rect(c, x + w / 2 + 2, y + 19, 1, 3, '#ffd34d'); }
      else { rect(c, x + w / 2 - 5, y + 19, 10, 3, '#e0a85a'); rect(c, x + w / 2 - 3, y + 19, 1, 1, '#b07030'); rect(c, x + w / 2 + 1, y + 19, 1, 1, '#b07030'); }
    }
    if (b.type === 'casa') rect(c, x + w - 10, y - 4, 4, 6, '#8a7a6a');
  }

  // ---------- Dibujo por fotograma ----------
  const rain = [];
  for (let i = 0; i < 170; i++) rain.push({ x: Math.random() * W, y: Math.random() * H, s: 2 + Math.random() * 2 });
  const treeRng = seeded(11), treeKind = P.TREES.map(function () { return treeRng() < .5 ? 0 : 1; });

  function drawTree(c, x, y, k) {
    rect(c, x - 4, y + 1, 9, 2, 'rgba(0,0,0,.18)');
    rect(c, x - 1, y - 4, 2, 6, '#5b3b22');
    const gr = k ? ['#4e6b3a', '#5f7f44', '#728f50'] : ['#55733a', '#6a8a45', '#7d9d55'];
    rect(c, x - 5, y - 11, 10, 8, gr[0]); rect(c, x - 4, y - 13, 8, 3, gr[1]); rect(c, x - 3, y - 11, 5, 3, gr[2]);
  }
  function drawVillager(v, t) {
    const x = Math.round(v.x), y = Math.round(v.y), L = v.look;
    const walking = v.path.length > 0, bob = walking ? Math.floor(t / 150) % 2 : 0;
    const small = v.age < 14, hh = small ? 7 : 10;
    rect(g, x - 3, y, 7, 2, 'rgba(0,0,0,.22)');
    rect(g, x - 2, y - 3 - bob, 2, 3, L.pants); rect(g, x + 1, y - 3 + (walking ? bob - 1 : 0), 2, 3, L.pants);
    rect(g, x - 3, y - hh + 2, 7, hh - 5, L.shirt);
    rect(g, x - 2, y - hh - 3, 5, 5, L.skin);
    rect(g, x - 2, y - hh - 4, 5, 2, L.hair);
    if (v.sex === 'f' && !small) { rect(g, x - 3, y - hh - 3, 1, 5, L.hair); rect(g, x + 3, y - hh - 3, 1, 5, L.hair); }
    if (v.job === 'cura') rect(g, x - 3, y - 3, 7, 3, '#1d1d24');
    if (selected === v.id) rect(g, x - 1, y - hh - 9 - (Math.floor(t / 300) % 2), 3, 3, '#ffd34d');
  }
  function drawStalls() {
    const cols = ['#e84a4a', '#4aa3e8', '#5ec46a', '#ffb347'], prod = ['#d63c3c', '#f2c94c', '#6fbf4a', '#e07b39'];
    P.STALL_COLS.forEach(function (sc, i) {
      const x = sc * T, y = P.STALL_ROW * T;
      rect(g, x + 1, y + 3, 14, 5, '#8a5a32');
      for (let k = 0; k < 6; k++) rect(g, x + 2 + k * 2, y + 3, 2, 2, prod[(i + k) % 4]);
      rect(g, x, y - 3, 16, 3, cols[i % 4]); for (let k = 0; k < 16; k += 4) rect(g, x + k, y - 3, 2, 3, '#f6ead2');
      rect(g, x, y - 3, 1, 9, '#5b3b22'); rect(g, x + 15, y - 3, 1, 9, '#5b3b22');
    });
  }
  function nightAlpha(h) {
    if (h >= 21.5 || h < 5.5) return .62;
    if (h >= 19) return .62 * (h - 19) / 2.5;
    if (h < 8) return .62 * (8 - h) / 2.5;
    return 0;
  }

  function render(t) {
    const key = JSON.stringify(S.houses);
    if (key !== bgKey) { bgKey = key; paintBackground(); }
    const h = P.hourOf(S), night = nightAlpha(h);
    g.drawImage(bg, 0, 0);
    // cultivos según la cosecha
    const F = P.FIELD, blessed = S.time < S.blessUntil;
    for (let y = F.r * T + 1; y < (F.r + F.h) * T; y += 8) for (let x = F.c * T + 2; x < (F.c + F.w) * T - 2; x += 5) {
      if (((x * 7 + y * 3) % 100) < S.harvest) rect(g, x, y, 2, 2, blessed ? (Math.floor(t / 400 + x) % 7 === 0 ? '#fff3a0' : '#d9b84a') : S.harvest < 30 ? '#a7a34a' : '#7fae45');
    }
    // guirnaldas de fiesta
    if (S.time < S.fiestaUntil) {
      const Q = P.PLAZA, cols = ['#e84a4a', '#ffd34d', '#4aa3e8', '#5ec46a'], x0 = Q.c * T, x1 = (Q.c + Q.w) * T;
      for (let x = x0; x < x1; x += 4) {
        const sag = Math.round(4 * Math.sin(Math.PI * (x - x0) / (x1 - x0)));
        rect(g, x, Q.r * T - 2 + sag, 2, 2, cols[(x / 4 + Math.floor(t / 300)) % 4 | 0]);
        rect(g, x, (Q.r + Q.h) * T - 4 + sag, 2, 2, cols[(x / 4 + 2 + Math.floor(t / 300)) % 4 | 0]);
      }
    }
    if (P.isMarket(S)) drawStalls();
    // árboles y vecinos ordenados por profundidad
    const items = [];
    P.TREES.forEach(function (tr, i) { items.push({ y: tr[1] * T + T - 1, tree: i }); });
    S.villagers.forEach(function (v) { if (!v.inside) items.push({ y: v.y, v: v }); });
    items.sort(function (a, b) { return a.y - b.y; });
    items.forEach(function (it) {
      if (it.v) drawVillager(it.v, t);
      else { const tr = P.TREES[it.tree]; drawTree(g, tr[0] * T + T / 2, tr[1] * T + T - 1, treeKind[it.tree]); }
    });
    // tiempo
    if (S.weather !== 'sol') { g.fillStyle = S.weather === 'lluvia' ? 'rgba(40,50,70,.28)' : 'rgba(80,90,110,.12)'; g.fillRect(0, 0, W, H); }
    if (S.weather === 'lluvia') {
      g.fillStyle = 'rgba(190,210,240,.75)';
      rain.forEach(function (d) { d.y += d.s * 2.2; d.x -= d.s * .4; if (d.y > H) { d.y = -4; d.x = Math.random() * W; } if (d.x < 0) d.x = W; g.fillRect(d.x | 0, d.y | 0, 1, 3); });
    }
    if (night > 0) {
      g.fillStyle = 'rgba(16,20,60,' + night + ')'; g.fillRect(0, 0, W, H);
      P.BUILDINGS.forEach(function (b) {
        const awake = S.villagers.some(function (v) { return v.inside === b.id && v.act !== 'dormir'; });
        if (!awake || !b.windows) return;
        b.windows.forEach(function (p) { rect(g, p[0], p[1], p[2], p[3], '#ffd77a'); g.fillStyle = 'rgba(255,200,90,.18)'; g.fillRect(p[0] - 4, p[1] - 3, p[2] + 8, p[3] + 6); });
      });
      const Q = P.PLAZA;
      [[Q.c, Q.r], [Q.c + Q.w, Q.r], [Q.c, Q.r + Q.h], [Q.c + Q.w, Q.r + Q.h]].forEach(function (p) {
        const x = p[0] * T, y = p[1] * T;
        g.fillStyle = 'rgba(255,210,120,.22)'; g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill();
        rect(g, x - 1, y - 1, 3, 3, '#ffe08a');
      });
    }
    drawUI();
  }

  function drawUI() {
    const k = ui.width / W;
    u.clearRect(0, 0, ui.width, ui.height);
    u.font = '600 ' + Math.round(6 * k) + 'px "Pixelify Sans", monospace';
    u.textAlign = 'center'; u.textBaseline = 'bottom';
    S.villagers.forEach(function (v) {
      const sel = selected === v.id;
      if ((!v.bubble && !sel) || v.inside) return;
      if (v.bubble && v.bubble.delay && S.time < v.bubble.delay && !sel) return;
      const text = v.bubble && !(v.bubble.delay && S.time < v.bubble.delay) ? v.bubble.text : v.name;
      const x = Math.min(Math.max(v.x * k, u.measureText(text).width / 2 + 6 * k), ui.width - u.measureText(text).width / 2 - 6 * k);
      const y = (v.y - (v.age < 14 ? 13 : 16)) * k;
      const w = u.measureText(text).width + 6 * k, h = 9 * k;
      u.fillStyle = sel && !v.bubble ? '#ffd34d' : '#fffaf0'; u.strokeStyle = '#2b1d14'; u.lineWidth = Math.max(1.5, k * .6);
      roundRect(x - w / 2, y - h, w, h, 2.5 * k); u.fill(); u.stroke();
      u.beginPath(); u.moveTo(v.x * k - 2 * k, y - .3 * k); u.lineTo(v.x * k, y + 2.5 * k); u.lineTo(v.x * k + 2 * k, y - .3 * k); u.fill();
      u.fillStyle = '#2b1d14'; u.fillText(text, x, y - 1.8 * k);
    });
  }
  function roundRect(x, y, w, h, r) { u.beginPath(); u.moveTo(x + r, y); u.arcTo(x + w, y, x + w, y + h, r); u.arcTo(x + w, y + h, x, y + h, r); u.arcTo(x, y + h, x, y, r); u.arcTo(x, y, x + w, y, r); u.closePath(); }

  // ---------- Interfaz HTML ----------
  const $ = function (id) { return document.getElementById(id); };
  const WEATHER = { sol: 'Sol', nubes: 'Nublado', lluvia: 'Lluvia' };
  let lastEvent = -1, tickerTimer = 0;
  function updateHUD() {
    const c = P.clock(S);
    $('c-day').textContent = 'Día ' + c.day;
    $('c-time').textContent = c.weekday + ' ' + c.label;
    $('c-weather').textContent = (S.time < S.fiestaUntil ? 'Fiestas · ' : P.isMarket(S) ? 'Mercado · ' : '') + WEATHER[S.weather] + ' · Cosecha ' + Math.round(S.harvest) + '%';
    const ev = S.events[S.events.length - 1];
    if (ev && S.events.length !== lastEvent) { lastEvent = S.events.length; showTicker(ev.short); }
    document.querySelectorAll('#powers button[data-p]').forEach(function (b) { b.classList.toggle('cool', (cool[b.dataset.p] || 0) > S.time); });
    if (selected) showCard(selected);
  }
  function showTicker(text) {
    const el = $('ticker'); el.style.opacity = 1; el.textContent = text;
    clearTimeout(tickerTimer); tickerTimer = setTimeout(function () { el.style.opacity = .55; }, 8000);
  }
  let toastTimer = 0;
  function toast(text, ms) {
    const el = $('toast'); el.textContent = text; el.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.opacity = 0; }, ms || 3800);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]; }); }
  function showCard(id) {
    const v = P.byId(S, id); if (!v) return;
    const s = P.villagerSummary(S, v), el = $('card');
    el.innerHTML = '<h2>' + esc(s.name) + '</h2>' +
      '<div class="row">' + s.age + ' años · ' + esc(s.job) + (s.money !== null ? ' · ' + s.money + ' €' : '') + '</div>' +
      '<div class="row">Ahora: ' + esc(s.act) + (v.inside ? '' : '') + ' · ' + s.mood + '</div>' +
      (s.partner ? '<div class="row">' + s.partnerLabel + ': ' + esc(s.partner) + '</div>' : '') +
      (s.friend ? '<div class="row">Mejor amistad: ' + esc(s.friend) + '</div>' : '') +
      (s.enemy ? '<div class="row">No traga a: ' + esc(s.enemy) + '</div>' : '') +
      s.notes.map(function (n) { return '<div class="note">· ' + esc(n) + '</div>'; }).join('') +
      '<div>' + s.traits.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>';
    el.style.display = 'block';
  }

  // 'chronicle' lo entienden todas las versiones de la skill; 'speak' solo las nuevas
  function speak(text) {
    if (alexa) { try { alexa.skill.sendMessage({ type: 'chronicle', text: text }); } catch (e) { console.warn(e); } }
  }
  function usePower(p, fromVoice, opts) {
    if (!fromVoice && (cool[p] || 0) > S.time) { toast('Paciencia… el santo descansa'); return null; }
    const text = P.applyPower(S, p, opts);
    if (!text) return null;
    cool[p] = S.time + (COOLDOWN[p] || 60);
    toast(text, p === 'loteria' ? 6000 : 3800); updateHUD(); save(true);
    if (!fromVoice && p === 'loteria') speak(text);
    return text;
  }

  document.querySelectorAll('#powers button[data-p]').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); usePower(b.dataset.p, false); });
  });
  $('speed').textContent = 'Velocidad x' + SPEEDS[speedIdx];
  $('speed').addEventListener('click', function (e) {
    e.stopPropagation(); speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').textContent = 'Velocidad x' + SPEEDS[speedIdx];
  });
  wrap.addEventListener('click', function (e) {
    const rct = wrap.getBoundingClientRect(), x = (e.clientX - rct.left) / scale, y = (e.clientY - rct.top) / scale;
    let best = null, bd = 14;
    S.villagers.forEach(function (v) { if (v.inside) return; const d = Math.hypot(v.x - x, v.y - 5 - y); if (d < bd) { bd = d; best = v; } });
    selected = best ? best.id : null;
    if (!best) $('card').style.display = 'none'; else showCard(best.id);
  });

  // ---------- Guardado ----------
  function save(force) {
    const now = Date.now();
    if (!force && now - lastSave < 60000) return;
    lastSave = now; S.savedAt = now;
    const json = P.serialize(S);
    try { localStorage.setItem('pueblo-vivo', json); } catch (e) { /* sin almacenamiento local */ }
    if (alexa) { try { alexa.skill.sendMessage({ type: 'save', state: json }); } catch (e) { console.warn(e); } }
  }
  addEventListener('pagehide', function () { save(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(true); });

  function load(startData) {
    let json = startData && startData.state, st = null;
    if (!json) { try { json = localStorage.getItem('pueblo-vivo'); } catch (e) { json = null; } }
    if (params.get('nuevo') === '1') json = null;
    try { st = json ? P.deserialize(json) : null; } catch (e) { st = null; }
    // por si el guardado local es más reciente que el de la skill
    if (st && startData && startData.state) {
      try { const loc = P.deserialize(localStorage.getItem('pueblo-vivo')); if (loc && (loc.savedAt || 0) > (st.savedAt || 0)) st = loc; } catch (e) { /* nada */ }
    }
    if (!st) return { S: P.createWorld(Date.now() % 100000), text: null, fresh: true };
    const since = st.time;
    const away = st.savedAt ? (Date.now() - st.savedAt) / 1000 : 0;
    const mins = Math.min(OFFLINE_CAP, Math.floor(away * OFFLINE_RATE));
    if (mins >= 30) P.fastForward(st, mins);
    return { S: st, text: mins >= 30 ? P.chronicle(st, since) : null, fresh: false };
  }

  // ---------- Conexión con Alexa ----------
  function onAlexaMessage(msg) {
    if (!msg || !S) return;
    if (msg.type === 'power') {
      usePower(msg.power, true, { name: msg.name || null });
    } else if (msg.type === 'requestChronicle') {
      speak(P.chronicle(S, Math.max(0, S.time - P.DAY)));
    } else if (msg.type === 'ask') {
      const v = P.findVillager(S, msg.name);
      if (v) { selected = v.id; showCard(v.id); speak(P.describeVillager(S, v)); }
      else speak('No conozco a nadie que se llame ' + (msg.name ? msg.name.charAt(0).toUpperCase() + msg.name.slice(1) : 'así') + ' en el pueblo.');
    }
  }

  function start(startData) {
    const r = load(startData);
    S = r.S;
    fit(); updateHUD();
    if (r.text) { showTicker('Mientras no estabas…'); if (alexa) speak(r.text); else toast(r.text, 9000); }
    if (r.fresh) toast('Bienvenido a Pueblo Vivo. Eres su santo patrón.');
    setTimeout(function () { $('hint').textContent = 'Prueba: «Alexa, ¿cómo está Paco?»'; }, 15000);
    setTimeout(function () { $('hint').style.opacity = 0; }, 35000);
    save(true);
    let prev = performance.now(), hudAcc = 0, acc = 0;
    const frame = 1000 / 30;
    function loop(t) {
      const dt = Math.min(250, t - prev); prev = t; acc += dt;
      if (acc >= frame) {
        P.step(S, (acc / 1000) * BASE_RATE * SPEEDS[speedIdx]);
        acc = 0;
        render(t);
        hudAcc += frame;
        if (hudAcc > 500) { hudAcc = 0; updateHUD(); save(false); }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // En un Echo Show existe window.Alexa; en un navegador normal se arranca sin él.
  let started = false;
  function startOnce(data) { if (started) return; started = true; start(data); }
  if (window.Alexa && Alexa.create) {
    Alexa.create({ version: '1.1' }).then(function (args) {
      alexa = args.alexa;
      alexa.skill.onMessage(onAlexaMessage);
      $('hint').textContent = 'Di: «Alexa, que llueva» · «Alexa, ¿qué ha pasado?»';
      startOnce(args.message || {});
    }).catch(function (err) { console.warn('Sin Alexa:', err); startOnce({}); });
    setTimeout(function () { startOnce({}); }, 6000);
  } else {
    startOnce({});
  }
})();
</script>
</body>
